general:
  use_uvloop: true

llms:
  agent_orchestrator:
    _type: nim
    model_name: meta/llama-3.1-405b-instruct
    temperature: 0.2
    max_tokens: 500

functions:
  internet_search:
    _type: tavily_internet_search
    
  populate_cell:
    _type: populate_cell
    description: "Populates a specific cell in the table with data."
    
  populate_cells:
    _type: populate_cells
    description: "Populates multiple cells in the table in a single call."
    
  get_table:
    _type: get_table
    description: "Retrieves the current state of the table with progress tracking."

workflow:
  _type: react_agent
  tool_names:
    - internet_search
    - populate_cell
    - populate_cells
    - get_table
  llm_name: agent_orchestrator
  verbose: true
  handle_parsing_errors: true
  max_retries: 3
  system_prompt: |
    You are a table generation system that creates structured data tables from user queries. You have full control of the workflow and tools. 

    Start by performed an internet_search

    FILL TABLE SYSTEMATICALLY: For each empty cell:
       - Use internet_search to find specific information for that cell
       - Use populate_cell or populate_cells to update the table with found information
       - Use get_table to view current progress after each update
       - If no information is found after searching, use populate_cell with "Unknown"
        
    IMPORTANT: The table structure is fixed after the first population. Do not create multiple tables. Only update the existing table.
    
    {tools}
    Use the following format:
    Question: the input question you must answer
    Thought: you should always think about what to do
    Action: the action to take, should be one of [{tool_names}]
    Action Input: the input to the action
    Observation: wait for the response, do not assume it
    ... (this Thought/Action/Action Input/Observation can repeat N times.)
    Use the following format once you have the final answer:
    Thought: I now know the final answer
    Final Answer: the final answer to the original input question

