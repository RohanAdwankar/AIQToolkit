general:
  use_uvloop: true

llms:
  agent_orchestrator:
    _type: nim
    model_name: meta/llama-3.1-405b-instruct
    temperature: 0.2
    max_tokens: 500
  search_llm:
    _type: nim
    model_name: meta/llama-3.3-70b-instruct
    temperature: 0.0
    max_tokens: 500

functions:
  internet_search:
    _type: tavily_internet_search
    
  create_table:
    _type: create_table
    description: "Creates a new table with specified dimensions and column names."
    
  populate_cell:
    _type: populate_cell
    description: "Populates a specific cell in the table with data."
    
  get_table:
    _type: get_table
    description: "Retrieves the current state of the table with progress tracking."
    
  export_table:
    _type: export_table
    description: "Exports the final table in various formats (CSV, JSON, Markdown)."
    
  search_agent:
    _type: tool_calling_agent
    tool_names:
      - internet_search
    llm_name: search_llm
    verbose: true
    handle_tool_errors: true
    description: "Performs internet searches to gather information for table construction."

  intent_agent:
    _type: tool_calling_agent
    tool_names:
      - search_agent
      - create_table
      - populate_cell
      - get_table
      - export_table
    llm_name: agent_orchestrator
    verbose: true
    handle_tool_errors: true
    description: "Analyzes user intent, determines table structure (rows and columns), fills cells by calling search_agent, and outputs the final table using table management tools."

workflow:
  _type: react_agent
  tool_names: [intent_agent]
  llm_name: agent_orchestrator
  verbose: true
  handle_parsing_errors: true
  max_retries: 3
  system_prompt: |
    You are a table generation system that creates structured data tables from user queries. Follow this workflow strictly:
    
    1. DETERMINE ROW COUNT: Use search_agent to find how many items match the user's criteria (e.g., "how many YC companies were in S2017 batch?")
    
    2. DETERMINE COLUMNS: Analyze the user's request to identify what attributes they want (e.g., company name, valuation, founder names)
    
    3. CREATE TABLE: Use create_table tool with the determined number of rows and column names. This creates a fixed structure that cannot be changed afterward.
    
    4. FILL TABLE SYSTEMATICALLY: For each empty cell:
       - Use search_agent to find specific information for that cell
       - Use populate_cell tool to update the cell with found information
       - Use get_table tool to view current progress after each update
       - If no information is found after searching, use populate_cell with "Unknown"
    
    5. MONITOR PROGRESS: Use get_table frequently to show the current state and track which cells still need to be filled
    
    6. EXPORT FINAL TABLE: Once all cells are filled, use export_table to present the final result in a clean format
    
    IMPORTANT: Once create_table is called, the table structure is locked. You can only populate cells, not change the structure.
    
    {tools}
    Use the following format:
    Question: the input question you must answer
    Thought: you should always think about what to do
    Action: the action to take, should be one of [{tool_names}]
    Action Input: the input to the action
    Observation: wait for the response, do not assume it
    ... (this Thought/Action/Action Input/Observation can repeat N times.)
    Use the following format once you have the final answer:
    Thought: I now know the final answer
    Final Answer: the final answer to the original input question

