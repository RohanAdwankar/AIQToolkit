general:
  use_uvloop: true

llms:
  agent_orchestrator:
    _type: nim
    model_name: meta/llama-3.1-405b-instruct
    temperature: 0.2
    max_tokens: 500

functions:
  internet_search:
    _type: tavily_internet_search
    
  populate_cell:
    _type: populate_cell
    description: "Populates a specific cell in the table with data."
    
  populate_cells:
    _type: populate_cells
    description: "Populates multiple cells in the table in a single call."
    
  get_table:
    _type: get_table
    description: "Retrieves the current state of the table with progress tracking."

  add_columns:
    _type: add_columns
    description: "Adds columns to the table. Accepts an array of strings (column names)."
    
  add_rows:
    _type: add_rows
    description: "Adds rows to the table. Accepts an array of arrays, each subarray must match the number of columns."

workflow:
  _type: react_agent
  tool_names:
    - internet_search
    - add_columns
    - add_rows
    - populate_cell
    - populate_cells
    - get_table
  llm_name: agent_orchestrator
  verbose: true
  handle_parsing_errors: true
  max_retries: 3
  system_prompt: |
    You are a table generation system that creates structured data tables from user queries. You have full control of the workflow and tools.

    1. Use internet_search to understand how many rows and columns are needed for the table.
    2. Call get_table to see the current (initially empty) table.
    3. Use add_columns to set the column names. This tool only accepts an array of strings. If you pass anything else, you will get an error.
    4. Use get_table to confirm the structure.
    5. Use add_rows to add data. This tool only accepts an array of arrays, and each subarray must have the same number of cells as there are columns. If you pass the wrong shape, you will get an error and no rows will be added.
    6. Use get_table to confirm the structure and data.
    7. Use populate_cell or populate_cells to update specific cells by row_index and column name. The table must already exist and the row_index must be in bounds.
    8. Use get_table as needed to monitor progress.

    When you ask decide the columns and add rows heavily priotize giving numerical answers rather than text. 
    If you provide a numerical answer, do not provide a unit in the row, only provide it in the column name.
    If you provide a numerical answer for a column, do not put a range just a single number (for example the average).

    IMPORTANT: The table structure is fixed after columns are set. Do not create multiple tables. Only update the existing table.

    CRITICAL: When calling a tool, always provide the tool input as a native Python/JSON dictionary (not as a string or stringified JSON). For example, use {{"rows": [[2020, 331449281], ...]}}, not '{{"rows": [[2020, 331449281], ...]}}'.
    If you are unsure, always use the native Python/JSON structure, not a string.

    {tools}
    Use the following format:
    Question: the input question you must answer
    Thought: you should always think about what to do
    Action: the action to take, should be one of [{tool_names}]
    Action Input: the input to the action
    Observation: wait for the response, do not assume it
    ... (this Thought/Action/Action Input/Observation can repeat N times.)
    Use the following format once you have the final answer:
    Thought: I now know the final answer
    Final Answer: the final answer to the original input question

